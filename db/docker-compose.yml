services:
  db:
    image: postgres:18-alpine
    container_name: dvibd-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dvibd}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dvibd}
      POSTGRES_DB: ${DB_NAME:-dvibd}
    ports:
      - "${PORT:-3001}:5432"
    volumes:
      - dvibd_pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dvibd} -d ${POSTGRES_DB:-dvibd}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dvibd

volumes:
  dvibd_pg_data:

networks:
  dvibd:
    driver: bridge

