[build]
  command = "npm --prefix ../../orm ci && npm --prefix ../../orm run generate && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 3000
  framework = "#custom"