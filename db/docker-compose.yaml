networks:
  dvibd-net:
    driver: bridge

services:
  postgres:
    image: postgres:18-alpine
    container_name: dvibd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
    ports:
      - "${DATABASE_PORT:?DATABASE_PORT is required}:${DATABASE_PORT:?DATABASE_PORT is required}"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - dvibd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvibd -d dvibd"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

